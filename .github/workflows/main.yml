name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          chmod +x packaging/build.sh
          packaging/build.sh ${{ steps.version.outputs.VERSION }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: somasave-client v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: build/deb/somasave-client_${{ steps.version.outputs.VERSION }}.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to apt repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ciamuthama/apt.git apt-repo
          cd apt-repo
          
          # Install reprepro
          sudo apt-get install -y reprepro
          
          # Create conf directory and distributions file if they don't exist
          mkdir -p conf
          if [ ! -f conf/distributions ]; then
            cat > conf/distributions << EOF
          Origin: somasave
          Label: somasave apt repository
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: amd64 i386 source
          Components: main
          Description: somasave-client releases
          EOF
          fi
          
          # Add the new .deb
          reprepro -b . includedeb stable \
              ../build/deb/somasave-client_${{ steps.version.outputs.VERSION }}.deb
          
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Release somasave-client v${{ steps.version.outputs.VERSION }}"
          git push